[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-neuron-plugin"
version = "0.1.0"
description = "verl PlatformBase backend for AWS Trainium (TorchNeuron)"
requires-python = ">=3.10"

# verl auto-loads every entry point in this group at import time, so installing
# this package is enough for verl to discover the `neuron` platform.
[project.entry-points."verl.plugins"]
neuron = "verl_neuron_plugin"

[tool.setuptools.packages.find]
include = ["verl_neuron_plugin*"]
